<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - البنيان للكهربائيات</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <h1>لوحة الإدارة</h1>
  <form id="productForm">
  <input type="text" id="name" placeholder="اسم المنتج" required>
  <input type="text" id="description" placeholder="الوصف">
  <input type="number" id="price" placeholder="السعر" required>
  <input type="text" id="category" placeholder="التصنيف">
  <input type="text" id="image" placeholder="رابط الصورة">
  <input type="password" id="adminKey" placeholder="كلمة السر" required>
  <button type="submit" id="submitBtn">إضافة المنتج</button>
</form>
<p id="message"></p>
<h2>المنتجات الحالية</h2>
<ul id="productList"></ul>
<script>
  const form = document.getElementById("productForm");
  let editingId = null;
  const message = document.getElementById("message");
  const productList = document.getElementById("productList");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    message.textContent = "جاري الإرسال...";
    const product = {
      name: document.getElementById("name").value,
      description: document.getElementById("description").value,
      price: Number(document.getElementById("price").value),
            category: document.getElementById("category").value,
      image: document.getElementById("image").value
    };
    const adminKey = document.getElementById("adminKey").value;
        const isEditing = editingId !== null;
    const url = isEditing
      ? "http://localhost:3000/api/products/" + editingId
      : "http://localhost:3000/api/products";
    const method = isEditing ? "PUT" : "POST";
    fetch(url, {
      method: method,
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify(product)
    })
      .then(function (res) {
        if (!res.ok) {
          throw new Error("فشل الإرسال: " + res.status);
        }
        return res.json();
      })
      .then(function (data) {
        message.textContent = isEditing
       ? "تم تعديل المنتج رقم " + data.id
       : "تمت إضافة المنتج برقم " + data.id;
editingId = null;
        submitBtn.textContent = "إضافة المنتج";
form.reset();
loadProducts();
      })
      .catch(function (err) {
        message.textContent = err.message;
      });
  });

  function loadProducts() {
    fetch("http://localhost:3000/api/products")
      .then(function (res) {
        return res.json();
      })
      .then(function (products) {
        productList.innerHTML = "";
        products.forEach(function (p) {
          const li = document.createElement("li");
          li.textContent = p.id + " - " + p.name + " - " + p.price;
          const btn = document.createElement("button");
          btn.textContent = "حذف";
          btn.className = "delete-btn";
          btn.addEventListener("click", function () {
            const adminKey = document.getElementById("adminKey").value;
            const isEditing = editingId !== null;
const url = isEditing
  ? "http://localhost:3000/api/products/" + editingId
  : "http://localhost:3000/api/products";
const method = isEditing ? "PUT" : "POST";
            fetch("http://localhost:3000/api/products/" + p.id, {
              method: "DELETE",
              headers: { "x-admin-key": adminKey }
            })
              .then(function (res) {
                if (!res.ok) {
                  throw new Error("فشل الحذف: " + res.status);
                }
                message.textContent = "تم حذف المنتج رقم " + p.id;
                loadProducts();
              })
              .catch(function (err) {
                message.textContent = err.message;
              });
          });
          const editBtn = document.createElement("button");
editBtn.textContent = "تعديل";
editBtn.className = "edit-btn";
editBtn.addEventListener("click", function () {
  document.getElementById("name").value = p.name;
  document.getElementById("description").value = p.description;
  document.getElementById("price").value = p.price;
  document.getElementById("category").value = p.category;
  document.getElementById("image").value = p.image || "";
  editingId = p.id;
    submitBtn.textContent = "حفظ التعديل";
  message.textContent = "تعديل المنتج رقم " + p.id;
});
li.appendChild(editBtn);
          li.appendChild(btn);
          productList.appendChild(li);
        });
      });
  }

  loadProducts();
</script>
</body>
</html>
