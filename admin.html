<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - البنيان للكهربائيات</title>
</head>
<body>
  <h1>لوحة الإدارة</h1>
  <form id="productForm">
  <input type="text" id="name" placeholder="اسم المنتج" required>
  <input type="text" id="description" placeholder="الوصف">
  <input type="number" id="price" placeholder="السعر" required>
  <input type="text" id="category" placeholder="التصنيف">
  <input type="password" id="adminKey" placeholder="كلمة السر" required>
  <button type="submit">إضافة المنتج</button>
</form>
<p id="message"></p>
<script>
  const form = document.getElementById("productForm");
  const message = document.getElementById("message");
  form.addEventListener("submit", function (e) {
  e.preventDefault();
  message.textContent = "جاري الإرسال...";  const product = {
    name: document.getElementById("name").value,
    description: document.getElementById("description").value,
    price: Number(document.getElementById("price").value),
    category: document.getElementById("category").value
  };
  const adminKey = document.getElementById("adminKey").value;
    fetch("http://localhost:3000/api/products", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-key": adminKey
    },
    body: JSON.stringify(product)
  })
    .then(function (res) {
      if (!res.ok) {
        throw new Error("فشل الإرسال: " + res.status);
      }
      return res.json();
    })
    .then(function (data) {
      message.textContent = "تمت إضافة المنتج برقم " + data.id;
      form.reset();
    })
    .catch(function (err) {
      message.textContent = err.message;
    });
});
</script>
</body>
</html>
